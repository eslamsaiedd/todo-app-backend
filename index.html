<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo Home</title>
  <link rel="stylesheet" href="./todoAppStyle.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">📝 ToDoApp</div>
    <div class="account-icon" id="accountIcon" title="Profile">
      <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Account">
    </div>
  </header>

  <!-- Main Content -->
  <main class="content">
    <h1>Welcome back 👋</h1>
    <p>Here are your tasks for today:</p>

    <!-- Add Task Form -->
    <div class="add-task">
      <input type="text" id="taskInput" placeholder="Enter a new task..." />
      <button id="addTaskBtn"> Add Task</button>
    </div>

    <!-- Tasks -->
    <div class="tasks-container" id="tasksContainer"></div>
  </main>

  <script src="./todoApp.js"></script>
</body>
</html>
